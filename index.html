<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mom's Basement</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0806; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(20,14,10,0.85); padding: 12px 16px; border-radius: 8px; max-width: 240px; pointer-events: none; }
  #ui h1 { font-size: 1.25rem; color: #ffcc99; margin-bottom: 4px; }
  #ui p { font-size: 0.8rem; opacity: 0.85; }
  #hint { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); padding: 6px 14px; border-radius: 16px; font-size: 0.75rem; z-index: 10; pointer-events: none; }
  #info { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(25,16,10,0.96); padding: 20px; border-radius: 12px; border: 1px solid #6a5038; max-width: 320px; display: none; z-index: 30; text-align: center; }
  #info button { margin-top: 12px; padding: 8px 18px; background: #ffaa66; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #1a120c; }
  #controls { position: absolute; bottom: 16px; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; padding: 0 16px; pointer-events: none; }
  .btn { width: 56px; height: 56px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; pointer-events: auto; user-select: none; }
  .btn:active { background: rgba(255,180,80,0.45); }
  #look-area { position: absolute; inset: 0; z-index: 5; }
  #loading { position: absolute; inset: 0; background: #0a0806; display: flex; align-items: center; justify-content: center; z-index: 50; }
</style>
</head>
<body>
<div id="loading">Loading basement...</div>
<div id="ui">
  <h1>Mom's Basement</h1>
  <p>Drag to look · Buttons to move · Tap objects</p>
</div>
<div id="hint">Stairs lead upstairs · Toilet door on the left</div>
<div id="info">
  <h2 id="info-title"></h2>
  <p id="info-text"></p>
  <button onclick="document.getElementById('info').style.display='none'">Close</button>
</div>
<div id="look-area"></div>
<div id="controls">
  <div class="btn" id="btn-left">◀</div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div class="btn" id="btn-forward">▲</div>
    <div class="btn" id="btn-back">▼</div>
  </div>
  <div class="btn" id="btn-right">▶</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1410, 0.01);
scene.background = new THREE.Color(0x0a0806);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Lighting tuned for visibility + atmosphere
const bulb = new THREE.PointLight(0xffe0b0, 6.5, 18, 1.1);
bulb.position.set(0, 2.3, 0);
bulb.castShadow = true;
scene.add(bulb);
scene.add(new THREE.AmbientLight(0x665544, 0.65));
const fill = new THREE.DirectionalLight(0xfff0dd, 0.35);
fill.position.set(3, 4, 5);
scene.add(fill);

// Simple materials (textures can be swapped later)
const carpetMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.95 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x6a5038, roughness: 0.8 });
const fabricMat = new THREE.MeshStandardMaterial({ color: 0x6b4a32, roughness: 0.9 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a4638, roughness: 0.9 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), carpetMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: 0x3a2e24 }));
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 2.7;
scene.add(ceiling);

const wallGeo = new THREE.PlaneGeometry(14, 2.7);
[[0,1.35,-7,0],[0,1.35,7,Math.PI],[-7,1.35,0,Math.PI/2],[7,1.35,0,-Math.PI/2]].forEach(([x,y,z,r]) => {
  const w = new THREE.Mesh(wallGeo, wallMat);
  w.position.set(x,y,z); w.rotation.y = r; w.receiveShadow = true;
  scene.add(w);
});

// Stairs leading to landing
const stairs = new THREE.Group();
for (let i = 0; i < 10; i++) {
  const step = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.17, 0.3), woodMat);
  step.position.set(0, i * 0.18 + 0.09, -i * 0.27);
  stairs.add(step);
}
stairs.position.set(4.8, 0, 3.2);
stairs.rotation.y = Math.PI * 0.5;
scene.add(stairs);

const upperFloor = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 2.8), woodMat);
upperFloor.rotation.x = -Math.PI / 2;
upperFloor.position.set(6.2, 1.85, 1.6);
scene.add(upperFloor);

// Doors
const upDoor = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2.05, 0.08), woodMat);
upDoor.position.set(6.2, 1.05, 2.9);
upDoor.userData = { name: "Upstairs Door", text: "Leads to the main floor. Mom's probably up there." };
scene.add(upDoor);

const toiletDoor = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.0, 0.08), woodMat);
toiletDoor.position.set(-6.2, 1.0, 1.5);
toiletDoor.userData = { name: "Toilet Door", text: "Basement bathroom. Pull-chain light. Toilet runs sometimes." };
scene.add(toiletDoor);

// Main furniture
const couch = new THREE.Group();
const cBase = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.45, 1.15), fabricMat);
cBase.position.y = 0.3;
couch.add(cBase);
const cBack = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.72, 0.22), fabricMat);
cBack.position.set(0, 0.72, -0.46);
couch.add(cBack);
couch.position.set(-2.4, 0, -2.2);
couch.userData = { name: "The Couch", text: "Permanent residency. Controllers and blankets live here." };
scene.add(couch);

const tv = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.95, 0.55), new THREE.MeshStandardMaterial({ color: 0x222222 }));
tv.position.set(1.8, 0.65, -5.2);
tv.userData = { name: "CRT TV", text: "Showing static. The remote is under the couch." };
scene.add(tv);

const desk = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 0.8), woodMat);
desk.position.set(3.2, 0.35, 1.8);
scene.add(desk);

const clickables = [upDoor, toiletDoor, couch, tv];

// Touch look
const lookArea = document.getElementById('look-area');
let yaw = 0, pitch = 0;
let touchStartX = 0, touchStartY = 0, lastYaw = 0, lastPitch = 0;
let looking = false;

lookArea.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    looking = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    lastYaw = yaw; lastPitch = pitch;
  }
}, { passive: true });

lookArea.addEventListener('touchmove', e => {
  if (!looking || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  yaw = lastYaw - dx * 0.0045;
  pitch = Math.max(-1.1, Math.min(1.1, lastPitch - dy * 0.0045));
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}, { passive: true });
lookArea.addEventListener('touchend', () => { looking = false; });

// Mouse look for desktop
let mouseLook = false;
lookArea.addEventListener('mousedown', e => { mouseLook = true; touchStartX = e.clientX; touchStartY = e.clientY; lastYaw = yaw; lastPitch = pitch; });
window.addEventListener('mousemove', e => {
  if (!mouseLook) return;
  const dx = e.clientX - touchStartX;
  const dy = e.clientY - touchStartY;
  yaw = lastYaw - dx * 0.004;
  pitch = Math.max(-1.1, Math.min(1.1, lastPitch - dy * 0.004));
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
});
window.addEventListener('mouseup', () => mouseLook = false);

// Movement
const move = { f: false, b: false, l: false, r: false };
function bindBtn(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); move[key] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); move[key] = false; });
  el.addEventListener('mousedown', () => move[key] = true);
  el.addEventListener('mouseup', () => move[key] = false);
  el.addEventListener('mouseleave', () => move[key] = false);
}
bindBtn('btn-forward', 'f');
bindBtn('btn-back', 'b');
bindBtn('btn-left', 'l');
bindBtn('btn-right', 'r');

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'w' || e.key === 'ArrowUp') move.f = true;
  if (e.key === 's' || e.key === 'ArrowDown') move.b = true;
  if (e.key === 'a' || e.key === 'ArrowLeft') move.l = true;
  if (e.key === 'd' || e.key === 'ArrowRight') move.r = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'ArrowUp') move.f = false;
  if (e.key === 's' || e.key === 'ArrowDown') move.b = false;
  if (e.key === 'a' || e.key === 'ArrowLeft') move.l = false;
  if (e.key === 'd' || e.key === 'ArrowRight') move.r = false;
});

const raycaster = new THREE.Raycaster();
lookArea.addEventListener('click', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
  const hits = raycaster.intersectObjects(clickables, true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !obj.userData.name) obj = obj.parent;
    if (obj && obj.userData.name) {
      document.getElementById('info-title').textContent = obj.userData.name;
      document.getElementById('info-text').textContent = obj.userData.text;
      document.getElementById('info').style.display = 'block';
    }
  }
});

const speed = 2.8;
function animate() {
  requestAnimationFrame(animate);
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  forward.y = 0; forward.normalize();
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  right.y = 0; right.normalize();

  if (move.f) camera.position.addScaledVector(forward, speed * 0.016);
  if (move.b) camera.position.addScaledVector(forward, -speed * 0.016);
  if (move.l) camera.position.addScaledVector(right, -speed * 0.016);
  if (move.r) camera.position.addScaledVector(right, speed * 0.016);

  camera.position.y = 1.6;
  // Soft bounds
  camera.position.x = Math.max(-6.5, Math.min(6.5, camera.position.x));
  camera.position.z = Math.max(-6.5, Math.min(6.5, camera.position.z));

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('loading').style.display = 'none';
</script>
</body>
</html>
